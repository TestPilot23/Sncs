name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run format -- --check
      - run: npm test
      - run: npm run build

  # No credentials and no secrets: pull requests on a public repo can run this safely. The real
  # `terraform plan` runs in the release workflow, where the approver can read it.
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: npm ci --no-fund --no-audit
      - run: npm run build:lambda
      - run: terraform fmt -check -recursive infrastructure/terraform
      - name: Validate and test each root
        run: |
          for root in bootstrap main; do
            (cd infrastructure/terraform/$root &&
              terraform init -backend=false -input=false >/dev/null &&
              terraform validate &&
              terraform test)
          done
      - run: infrastructure/tests/static-checks.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build image and smoke-test nginx
        run: |
          docker build -t sncs:ci .
          docker run -d --name sncs-ci -p 8087:80 sncs:ci
          for i in $(seq 1 15); do curl -sf http://localhost:8087/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8087/ | grep -q '<div id="root">'
          curl -sf http://localhost:8087/some/deep/path >/dev/null
