version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(docker)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: terraform
    directory: /infrastructure/terraform/bootstrap
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: terraform
    directory: /infrastructure/terraform/main
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
